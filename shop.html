<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Oni Fighting - Blox Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            background: radial-gradient(circle at top, #1e1b38 0%, #090a12 100%);
            color: #fff;
            font-family: 'Press Start 2P', monospace, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .shop-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(10, 12, 22, 0.95);
            border-bottom: 3px solid #ffd700;
            flex-shrink: 0;
        }
        .shop-title {
            font-size: clamp(12px, 2.5vw, 22px);
            color: #ffd700;
            text-shadow: 2px 2px 0 #b8860b, 3px 3px 0 #000;
        }
        .wallet-box {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: clamp(11px, 2vw, 16px);
            color: #ffd700;
        }
        .play-again-btn {
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            color: #fff;
            border: 2px solid #86efac;
            border-radius: 10px;
            padding: 10px 18px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(10px, 1.8vw, 14px);
            cursor: pointer;
            box-shadow: 0 4px 0 #14532d;
        }
        .play-again-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #14532d;
        }

        /* MAIN LAYOUT */
        .shop-main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 16px;
            padding: 14px;
        }

        /* LEFT: LIVE CHARACTER PREVIEW */
        .preview-panel {
            width: 32%;
            min-width: 220px;
            background: rgba(15, 18, 32, 0.9);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
        }
        #preview-canvas {
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle, #2a244d 0%, #0d0f1a 75%);
            border: 2px solid #334155;
            border-radius: 12px;
            image-rendering: pixelated;
        }
        .preview-controls {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .preview-btn {
            flex: 1;
            background: #334155;
            color: #fff;
            border: 2px solid #64748b;
            border-radius: 8px;
            padding: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            cursor: pointer;
        }
        .equipped-summary {
            font-size: 8px;
            color: #94a3b8;
            line-height: 1.6;
            text-align: center;
            width: 100%;
        }

        /* RIGHT: TABS & ITEMS GRID */
        .catalog-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .tabs-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
            overflow-x: auto;
        }
        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 10px 14px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(8px, 1.4vw, 11px);
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
            color: #000;
            border-color: #fef08a;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding-right: 6px;
            padding-bottom: 20px;
        }

        .shop-card {
            position: relative;
            background: linear-gradient(145deg, #1e2238 0%, #121524 100%);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }
        .shop-card.equipped {
            border-color: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
        }
        .card-rarity {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 7px;
            padding: 3px 5px;
            border-radius: 4px;
            background: #ec4899;
            color: #fff;
        }
        .card-icon {
            font-size: 28px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-title {
            font-size: 10px;
            color: #ffd700;
        }
        .card-desc {
            font-size: 7.5px;
            color: #cbd5e1;
            line-height: 1.4;
            min-height: 22px;
        }
        .card-btn {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .btn-buy {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            color: #052e16;
            border-color: #bbf7d0;
        }
        .btn-equip {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            color: #fff;
            border-color: #bae6fd;
        }
        .btn-equipped {
            background: #15803d;
            color: #bbf7d0;
            border-color: #22c55e;
        }

        @media (max-width: 768px) {
            .shop-main {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
            }
            .preview-panel {
                width: 100%;
                flex-direction: row;
                padding: 8px;
                gap: 10px;
            }
            #preview-canvas {
                width: 95px;
                height: 95px;
            }
            .items-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="shop-topbar">
        <div class="shop-title">🛒 ONI BLOX SHOP</div>
        <div class="wallet-box" id="wallet-display">🪙 0</div>
        <button class="play-again-btn" onclick="window.location.href='game.html'">⚔️ RIGIOCA</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="shop-main">
        <!-- LIVE PREVIEW PANEL -->
        <div class="preview-panel">
            <canvas id="preview-canvas" width="220" height="220"></canvas>
            <div style="display:flex; flex-direction:column; gap:8px; width:100%;">
                <div class="equipped-summary" id="equipped-summary"></div>
                <div class="preview-controls">
                    <button class="preview-btn" onclick="triggerPreviewAttack()">⚔️ TEST ATTACK</button>
                </div>
            </div>
        </div>

        <!-- CATALOG PANEL -->
        <div class="catalog-panel">
            <div class="tabs-row">
                <button class="tab-btn active" onclick="switchTab('skins', this)">🎨 SKINS</button>
                <button class="tab-btn" onclick="switchTab('auras', this)">🔥 AURE & ANIM</button>
                <button class="tab-btn" onclick="switchTab('trails', this)">💨 SCIE DASH</button>
                <button class="tab-btn" onclick="switchTab('upgrades', this)">⚡ GAMEPASS</button>
            </div>
            <div class="items-grid" id="shop-grid"></div>
        </div>
    </div>

    <script>
        // ====================================================================
        // 1. SHOP CATALOG DEFINITION (Skins, Auras, Trails, Permanent Upgrades)
        // ====================================================================
        const SHOP_ITEMS = {
            skins: [
                { id: 'skin_default', name: 'Ronin Base',      price: 0,  rarity: 'BASE',   icon: '🥋', desc: 'Lo stile classico del guerriero.', filter: 'none', spriteFolder: './img/MartialHero/' },
                { id: 'skin_golden',  name: 'Golden Emperor',  price: 25, rarity: 'LEGEND', icon: '👑', desc: 'Armatura dorata imperiale.',        filter: 'sepia(1) saturate(3.5) hue-rotate(5deg) brightness(1.15)', spriteFolder: './img/MartialHero/' },
                { id: 'skin_cyber',   name: 'Cyber Shinobi',   price: 35, rarity: 'MYTHIC', icon: '🤖', desc: 'Tinta al neon ciano cibernetica.',  filter: 'hue-rotate(175deg) saturate(2.5) brightness(1.1)', spriteFolder: './img/MartialHero/' },
                { id: 'skin_shadow',  name: 'Shadow Specter',  price: 45, rarity: 'DARK',   icon: '🌑', desc: 'Spettro oscuro dell\'ombra.',       filter: 'invert(0.88) hue-rotate(180deg) contrast(1.3)', spriteFolder: './img/MartialHero/' },
                { id: 'skin_demon',   name: 'Crimson Oni',     price: 60, rarity: 'ONI',    icon: '👹', desc: 'Furia cremisi del demone.',         filter: 'hue-rotate(325deg) saturate(3.2) contrast(1.2)', spriteFolder: './img/MartialHero/' }
            ],
            auras: [
                { id: 'aura_none',    name: 'Nessuna Aura',    price: 0,  rarity: 'BASE',   icon: '✖️', desc: 'Combatti senza aura visiva.',       auraType: 'none', color: 'transparent' },
                { id: 'aura_red',     name: 'Oni Flame Aura',  price: 20, rarity: 'RARE',   icon: '🔥', desc: 'Attiva l\'Aura Rossa animata!',     auraType: 'sprite1', imageSrc: './img/MartialHero/Aura.png', color: '#ff3126' },
                { id: 'aura_purple',  name: 'Night Void Aura', price: 30, rarity: 'EPIC',   icon: '🔮', desc: 'Attiva l\'Aura Viola del Vuoto!',   auraType: 'sprite2', imageSrc: './img/Night/Aura.png', color: '#a855f7' },
                { id: 'aura_thunder', name: 'Thunder God',     price: 45, rarity: 'MYTHIC', icon: '⚡', desc: 'Scintille elettriche attorno a te!', auraType: 'procedural_lightning', color: '#00e5ff' },
                { id: 'aura_gold',    name: 'Super Saiyan',    price: 70, rarity: 'GODLY',  icon: '✨', desc: 'Aura divina dorata +10% Speed!',     auraType: 'procedural_gold', color: '#ffd700' }
            ],
            trails: [
                { id: 'trail_red',    name: 'Scia Cremisi',    price: 0,  rarity: 'BASE',   icon: '🩸', desc: 'Scia standard rossa.',              trailColor: '#FF3126' },
                { id: 'trail_cyan',   name: 'Scia Cyber Lampo',price: 15, rarity: 'RARE',   icon: '💠', desc: 'Particelle e scia azzurro neon.',   trailColor: '#00e5ff' },
                { id: 'trail_emerald',name: 'Scia Veleno Jade',price: 20, rarity: 'EPIC',   icon: '🧪', desc: 'Scia verde smeraldo radioattiva.',  trailColor: '#39ff14' },
                { id: 'trail_gold',   name: 'Scia Polvere Oro',price: 35, rarity: 'LEGEND', icon: '🌟', desc: 'Scintille dorate a ogni passo.',    trailColor: '#ffd700' }
            ],
            upgrades: [
                { id: 'up_vip',       name: '2X Coins VIP Pass', price: 40, rarity: 'PASS', icon: '🪙', desc: 'Raddoppia per sempre le monete ottenute!', isUpgrade: true },
                { id: 'up_hp',        name: 'Titan Vitality',    price: 25, rarity: 'BUFF', icon: '❤️', desc: 'Inizia ogni run con +600 HP Massimi!',    isUpgrade: true },
                { id: 'up_dmg',       name: 'Demon Katana',      price: 30, rarity: 'BUFF', icon: '🗡️', desc: 'Inizia ogni run con +35 Danno Base!',     isUpgrade: true },
                { id: 'up_perk',      name: 'Lucky Mask Start',  price: 50, rarity: 'OP!',  icon: '🎭', desc: 'Inizia ogni run con 1 Perk casuale gratis!', isUpgrade: true }
            ]
        };

        // ====================================================================
        // 2. PERSISTENT STATE IN LOCALSTORAGE
        // ====================================================================
        let walletCoins = parseInt(localStorage.getItem('oni_wallet_coins')) || 0;
        let ownedItems = JSON.parse(localStorage.getItem('oni_shop_owned') || '["skin_default","aura_none","trail_red"]');
        let equipped = JSON.parse(localStorage.getItem('oni_shop_equipped') || '{"skin":"skin_default","aura":"aura_none","trail":"trail_red"}');
        let currentTab = 'skins';

        function saveShopData() {
            localStorage.setItem('oni_wallet_coins', walletCoins);
            localStorage.setItem('oni_shop_owned', JSON.stringify(ownedItems));
            localStorage.setItem('oni_shop_equipped', JSON.stringify(equipped));
            updateUI();
        }

        function switchTab(tab, btnEl) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            renderGrid();
        }

        function updateUI() {
            document.getElementById('wallet-display').innerText = `🪙 ${walletCoins}`;
            const skinObj = SHOP_ITEMS.skins.find(s => s.id === equipped.skin) || SHOP_ITEMS.skins[0];
            const auraObj = SHOP_ITEMS.auras.find(a => a.id === equipped.aura) || SHOP_ITEMS.auras[0];
            const trailObj = SHOP_ITEMS.trails.find(t => t.id === equipped.trail) || SHOP_ITEMS.trails[0];

            // Save direct config object so game.js can read it in 1 line
            localStorage.setItem('oni_active_loadout', JSON.stringify({
                skinFilter: skinObj.filter,
                spriteFolder: skinObj.spriteFolder,
                auraId: auraObj.id,
                auraType: auraObj.auraType,
                auraColor: auraObj.color,
                trailColor: trailObj.trailColor,
                vipCoins: ownedItems.includes('up_vip'),
                bonusHp: ownedItems.includes('up_hp') ? 600 : 0,
                bonusDmg: ownedItems.includes('up_dmg') ? 35 : 0,
                freeStartPerk: ownedItems.includes('up_perk')
            }));

            document.getElementById('equipped-summary').innerHTML =
                `SKIN: <b style="color:#ffd700">${skinObj.name}</b><br>` +
                `AURA: <b style="color:#38bdf8">${auraObj.name}</b><br>` +
                `SCIA: <b style="color:${trailObj.trailColor}">${trailObj.name}</b>`;

            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            const list = SHOP_ITEMS[currentTab] || [];

            list.forEach(item => {
                const isOwned = ownedItems.includes(item.id);
                const isEquipped = (
                    (currentTab === 'skins' && equipped.skin === item.id) ||
                    (currentTab === 'auras' && equipped.aura === item.id) ||
                    (currentTab === 'trails' && equipped.trail === item.id) ||
                    (currentTab === 'upgrades' && isOwned)
                );

                const card = document.createElement('div');
                card.className = 'shop-card' + (isEquipped ? ' equipped' : '');

                let btnHtml = '';
                if (!isOwned) {
                    btnHtml = `<button class="card-btn btn-buy" onclick="buyItem('${item.id}', ${item.price})">🪙 COMPRA (${item.price})</button>`;
                } else if (item.isUpgrade) {
                    btnHtml = `<button class="card-btn btn-equipped" disabled>ATTIVO ✅</button>`;
                } else if (isEquipped) {
                    btnHtml = `<button class="card-btn btn-equipped" disabled>EQUIPAGGIATO ✅</button>`;
                } else {
                    btnHtml = `<button class="card-btn btn-equip" onclick="equipItem('${item.id}')">EQUIPAGGIA</button>`;
                }

                card.innerHTML = `
                    <div class="card-rarity">${item.rarity}</div>
                    <div class="card-icon">${item.icon}</div>
                    <div class="card-title">${item.name}</div>
                    <div class="card-desc">${item.desc}</div>
                    ${btnHtml}
                `;
                grid.appendChild(card);
            });
        }

        function buyItem(id, price) {
            if (walletCoins < price) {
                const w = document.getElementById('wallet-display');
                w.style.background = 'rgba(239, 68, 68, 0.4)';
                setTimeout(() => w.style.background = 'rgba(255, 215, 0, 0.15)', 400);
                return;
            }
            walletCoins -= price;
            if (!ownedItems.includes(id)) ownedItems.push(id);
            equipItem(id);
            saveShopData();
        }

        function equipItem(id) {
            if (currentTab === 'skins') equipped.skin = id;
            else if (currentTab === 'auras') equipped.aura = id;
            else if (currentTab === 'trails') equipped.trail = id;
            saveShopData();
        }

        // ====================================================================
        // 3. LIVE INTERACTIVE CHARACTER PREVIEW CANVAS
        // ====================================================================
        const pCanvas = document.getElementById('preview-canvas');
        const ctx = pCanvas.getContext('2d');

        const idleImg = new Image();
        idleImg.src = './img/MartialHero/Idle.png';
        const attackImg = new Image();
        attackImg.src = './img/MartialHero/Attack1.png';
        const aura1Img = new Image();
        aura1Img.src = './img/MartialHero/Aura.png';
        const aura2Img = new Image();
        aura2Img.src = './img/Night/Aura.png';

        let pFrame = 0, pTick = 0, isPreviewAttacking = false;
        let auraFrame = 0;
        const previewParticles = [];

        function triggerPreviewAttack() {
            isPreviewAttacking = true;
            pFrame = 0;
        }

        function animatePreview() {
            ctx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            const skinObj = SHOP_ITEMS.skins.find(s => s.id === equipped.skin) || SHOP_ITEMS.skins[0];
            const auraObj = SHOP_ITEMS.auras.find(a => a.id === equipped.aura) || SHOP_ITEMS.auras[0];
            const trailObj = SHOP_ITEMS.trails.find(t => t.id === equipped.trail) || SHOP_ITEMS.trails[0];

            // Floor line
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(20, 175, 180, 6);

            // Spawn trail particles
            if (Math.random() < 0.35) {
                previewParticles.push({
                    x: 90 + Math.random() * 40,
                    y: 170,
                    vy: -1 - Math.random() * 2,
                    life: 1,
                    color: trailObj.trailColor
                });
            }
            for (let i = previewParticles.length - 1; i >= 0; i--) {
                const pt = previewParticles[i];
                pt.y += pt.vy;
                pt.life -= 0.03;
                if (pt.life <= 0) { previewParticles.splice(i, 1); continue; }
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life;
                ctx.fillRect(pt.x, pt.y, 5, 5);
            }
            ctx.globalAlpha = 1;

            // Procedural or Sprite Aura
            if (auraObj.auraType === 'procedural_lightning' || auraObj.auraType === 'procedural_gold') {
                ctx.save();
                ctx.strokeStyle = auraObj.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(110, 125, 48 + Math.sin(Date.now() * 0.01) * 6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            } else if ((auraObj.auraType === 'sprite1' && aura1Img.complete && aura1Img.naturalWidth > 0) ||
                       (auraObj.auraType === 'sprite2' && aura2Img.complete && aura2Img.naturalWidth > 0)) {
                const aImg = auraObj.auraType === 'sprite1' ? aura1Img : aura2Img;
                const afw = aImg.width / 16;
                ctx.drawImage(aImg, auraFrame * afw, 0, afw, aImg.height, 35, 45, afw * 1.4, aImg.height * 1.4);
            }

            // Draw Character Sprite with selected Skin Filter
            const activeImg = isPreviewAttacking ? attackImg : idleImg;
            const maxF = isPreviewAttacking ? 6 : 8;

            pTick++;
            if (pTick % 6 === 0) {
                pFrame++;
                auraFrame = (auraFrame + 1) % 16;
                if (pFrame >= maxF) {
                    pFrame = 0;
                    isPreviewAttacking = false;
                }
            }

            ctx.save();
            if (skinObj.filter && skinObj.filter !== 'none') {
                ctx.filter = skinObj.filter;
            }
            if (activeImg.complete && activeImg.naturalWidth > 0) {
                const fw = activeImg.width / maxF;
                ctx.drawImage(activeImg, pFrame * fw, 0, fw, activeImg.height, 110 - (fw * 1.8) / 2, 125 - (activeImg.height * 1.8) / 2, fw * 1.8, activeImg.height * 1.8);
            } else {
                ctx.fillStyle = '#ff3126';
                ctx.fillRect(85, 85, 50, 90);
            }
            ctx.restore();

            requestAnimationFrame(animatePreview);
        }

        updateUI();
        animatePreview();
    </script>
</body>
</html>
