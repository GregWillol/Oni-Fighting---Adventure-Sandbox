<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Oni Fighting - Blox Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="./css/style.css">
    <!-- SDK ufficiale CrazyGames (opzionale: funziona anche offline in locale) -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            background: radial-gradient(circle at top, #1e1b38 0%, #090a12 100%);
            color: #fff;
            font-family: 'Press Start 2P', monospace, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .shop-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(10, 12, 22, 0.95);
            border-bottom: 3px solid #ffd700;
            flex-shrink: 0;
        }
        .shop-title {
            font-size: clamp(12px, 2.5vw, 22px);
            color: #ffd700;
            text-shadow: 2px 2px 0 #b8860b, 3px 3px 0 #000;
        }
        .wallet-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wallet-box {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: clamp(11px, 2vw, 16px);
            color: #ffd700;
            transition: transform 0.2s, background 0.2s;
        }
        .add-coins-btn {
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            color: #fff;
            border: 2px solid #86efac;
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 3px 0 #14532d;
        }
        .play-again-btn {
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            color: #fff;
            border: 2px solid #86efac;
            border-radius: 10px;
            padding: 10px 18px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(10px, 1.8vw, 14px);
            cursor: pointer;
            box-shadow: 0 4px 0 #14532d;
        }
        .play-again-btn:active, .add-coins-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #14532d;
        }

        /* MAIN LAYOUT */
        .shop-main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 16px;
            padding: 14px;
        }

        /* LEFT: LIVE CHARACTER PREVIEW */
        .preview-panel {
            width: 32%;
            min-width: 220px;
            background: rgba(15, 18, 32, 0.9);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
        }
        #preview-canvas {
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle, #2a244d 0%, #0d0f1a 75%);
            border: 2px solid #334155;
            border-radius: 12px;
            image-rendering: pixelated;
        }
        .preview-controls {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .preview-btn {
            flex: 1;
            background: #334155;
            color: #fff;
            border: 2px solid #64748b;
            border-radius: 8px;
            padding: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            cursor: pointer;
        }
        .equipped-summary {
            font-size: 8px;
            color: #94a3b8;
            line-height: 1.6;
            text-align: center;
            width: 100%;
        }

        /* RIGHT: TABS & ITEMS GRID */
        .catalog-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .tabs-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 10px 14px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(8px, 1.4vw, 11px);
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
            color: #000;
            border-color: #fef08a;
        }
        .tab-btn.tab-coins {
            border-color: #22c55e;
            color: #4ade80;
            background: rgba(20, 83, 45, 0.4);
        }
        .tab-btn.tab-coins.active {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            color: #052e16;
            border-color: #bbf7d0;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding-right: 6px;
            padding-bottom: 20px;
        }

        .shop-card {
            position: relative;
            background: linear-gradient(145deg, #1e2238 0%, #121524 100%);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }
        .shop-card.equipped {
            border-color: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
        }
        .shop-card.coin-card {
            border-color: #eab308;
            background: radial-gradient(circle at top, #2e2612 0%, #121524 100%);
        }
        .card-rarity {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 7px;
            padding: 3px 5px;
            border-radius: 4px;
            background: #ec4899;
            color: #fff;
        }
        .card-icon {
            font-size: 28px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-title {
            font-size: 10px;
            color: #ffd700;
        }
        .card-desc {
            font-size: 7.5px;
            color: #cbd5e1;
            line-height: 1.4;
            min-height: 22px;
        }
        .card-btn {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .btn-buy {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            color: #052e16;
            border-color: #bbf7d0;
        }
        .btn-real-money {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            color: #000;
            border-color: #fef08a;
            box-shadow: 0 3px 0 #854d0e;
        }
        .btn-ad {
            background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
            color: #fff;
            border-color: #e9d5ff;
        }
        .btn-equip {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            color: #fff;
            border-color: #bae6fd;
        }
        .btn-equipped {
            background: #15803d;
            color: #bbf7d0;
            border-color: #22c55e;
        }

        /* MICROTRANSACTION CHECKOUT MODAL */
        .iap-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 6, 12, 0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
        }
        .iap-modal {
            background: linear-gradient(180deg, #1e2238 0%, #0f111c 100%);
            border: 3px solid #ffd700;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.25);
        }
        .iap-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .iap-method-btn {
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            color: #fff;
            padding: 10px 6px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
        }
        .iap-method-btn.selected {
            border-color: #4ade80;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        .iap-confirm-btn {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            color: #052e16;
            border: 2px solid #bbf7d0;
            border-radius: 10px;
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
        }
        .iap-cancel-btn {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .shop-main {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
            }
            .preview-panel {
                width: 100%;
                flex-direction: row;
                padding: 8px;
                gap: 10px;
            }
            #preview-canvas {
                width: 95px;
                height: 95px;
            }
            .items-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="shop-topbar">
        <div class="shop-title">🛒 ONI BLOX SHOP</div>
        <div class="wallet-container">
            <div class="wallet-box" id="wallet-display">🪙 0</div>
            <button class="add-coins-btn" onclick="openCoinsTab()" title="Ricarica Monete">+</button>
        </div>
        <button class="play-again-btn" onclick="window.location.href='game.html'">⚔️ RIGIOCA</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="shop-main">
        <!-- LIVE PREVIEW PANEL -->
        <div class="preview-panel">
            <canvas id="preview-canvas" width="220" height="220"></canvas>
            <div style="display:flex; flex-direction:column; gap:8px; width:100%;">
                <div class="equipped-summary" id="equipped-summary"></div>
                <div class="preview-controls">
                    <button class="preview-btn" onclick="triggerPreviewAttack()">⚔️ TEST ATTACK</button>
                </div>
            </div>
        </div>

        <!-- CATALOG PANEL -->
        <div class="catalog-panel">
            <div class="tabs-row">
                <button class="tab-btn tab-coins" id="tab-btn-coins" onclick="switchTab('coins', this)">💎 MONETE (+)</button>
                <button class="tab-btn active" onclick="switchTab('weapons', this)">⚔️ KATANE (60)</button>
                <button class="tab-btn" onclick="switchTab('pets', this)">🐉 PETS (10)</button>
                <button class="tab-btn" onclick="switchTab('skins', this)">🎨 SKINS (12)</button>
                <button class="tab-btn" onclick="switchTab('auras', this)">🔥 AURE (10)</button>
                <button class="tab-btn" onclick="switchTab('kills', this)">💀 FINISHERS (8)</button>
                <button class="tab-btn" onclick="switchTab('trails', this)">💨 SCIE (10)</button>
                <button class="tab-btn" onclick="switchTab('upgrades', this)">⚡ GAMEPASS (10)</button>
            </div>
            <div class="items-grid" id="shop-grid"></div>
        </div>
    </div>

    <!-- CHECKOUT / AD MODAL OVERLAY -->
    <div class="iap-modal-overlay" id="iap-modal">
        <div class="iap-modal">
            <div style="font-size:34px;" id="iap-icon">💰</div>
            <div style="font-size:12px; color:#ffd700;" id="iap-title">PACCHETTO MONETE</div>
            <div style="font-size:9px; color:#cbd5e1; line-height:1.5;" id="iap-desc">+10,000 Monete</div>

            <div id="iap-payment-section">
                <div style="font-size:8px; color:#94a3b8; margin-bottom:8px;">METODO DI PAGAMENTO:</div>
                <div class="iap-methods">
                    <button class="iap-method-btn selected" onclick="selectPayMethod(this)">💳 CARTA / POSTEPAY</button>
                    <button class="iap-method-btn" onclick="selectPayMethod(this)">🅿️ PAYPAL</button>
                    <button class="iap-method-btn" onclick="selectPayMethod(this)">🍎 APPLE PAY</button>
                    <button class="iap-method-btn" onclick="selectPayMethod(this)">🤖 GOOGLE PAY</button>
                </div>
            </div>

            <button class="iap-confirm-btn" id="iap-confirm-btn" onclick="confirmMicrotransaction()">PAGA E RISCATTA</button>
            <button class="iap-cancel-btn" id="iap-cancel-btn" onclick="closeIapModal()">ANNULLA</button>
        </div>
    </div>

    <script>
    // ========================================================================
    // 1. 60 ELEMENTAL KATANAS (Prezzi: da 250 fino a 42.000 Monete)
    // ========================================================================
    const ELEMENTS = [
        { key: 'fire',      name: 'Ignis',      icon: '🔥', blade: '#fef08a', glow: '#f97316', perkDesc: 'Brucia i nemici (+25% Burn Dmg)' },
        { key: 'lightning', name: 'Raikiri',    icon: '⚡', blade: '#e0f2fe', glow: '#00e5ff', perkDesc: 'Paralizza i nemici (Stun Elettrico)' },
        { key: 'poison',    name: 'Viper',      icon: '☠️', blade: '#dcfce7', glow: '#39ff14', perkDesc: 'Infetta con nube tossica (+20% Veleno)' },
        { key: 'ice',       name: 'Cryo',       icon: '❄️', blade: '#f0f9ff', glow: '#38bdf8', perkDesc: 'Congela e rallenta i nemici (-50% Speed)' },
        { key: 'blood',     name: 'Muramasa',   icon: '🩸', blade: '#fecdd3', glow: '#e11d48', perkDesc: 'Ruba vita ad ogni fendente (+12% Vampirismo)' },
        { key: 'void',      name: 'Abyss',      icon: '🌑', blade: '#f3e8ff', glow: '#9333ea', perkDesc: 'Giustizia i nemici sotto il 35% HP' },
        { key: 'wind',      name: 'Gale',       icon: '🌪️', blade: '#ecfdf5', glow: '#10b981', perkDesc: 'Leggera come il vento (+15% Velocità)' },
        { key: 'holy',      name: 'Celestial',  icon: '✨', blade: '#ffffff', glow: '#facc15', perkDesc: 'Benedizione Divina (+400 HP Massimi)' },
        { key: 'earth',     name: 'Obsidian',   icon: '🪨', blade: '#cbd5e1', glow: '#d97706', perkDesc: 'Impatto sismico (+50% Knockback)' },
        { key: 'chaos',     name: 'Amaterasu',  icon: '👹', blade: '#ffedd5', glow: '#ff0055', perkDesc: 'Sblocca palle di fuoco sui fendenti!' }
    ];

    const BLADE_FORMS = [
        { suffix: 'Wakizashi',    rarity: 'COMMON', len: 78,  w: 6,  serrated: false, priceMult: 25,   dmgMult: 1.0 },
        { suffix: 'Uchigatana',   rarity: 'RARE',   len: 92,  w: 7,  serrated: false, priceMult: 65,   dmgMult: 1.6 },
        { suffix: 'Tachi',        rarity: 'EPIC',   len: 102, w: 8,  serrated: false, priceMult: 150,  dmgMult: 2.3 },
        { suffix: 'Nodachi',      rarity: 'LEGEND', len: 118, w: 8,  serrated: false, priceMult: 350,  dmgMult: 3.2 },
        { suffix: 'Oni Fang',     rarity: 'MYTHIC', len: 110, w: 9,  serrated: true,  priceMult: 750,  dmgMult: 4.5 },
        { suffix: 'Dragon Relic', rarity: 'GODLY',  len: 126, w: 10, serrated: true,  priceMult: 1500, dmgMult: 6.5 }
    ];

    const GENERATED_WEAPONS = [
        { id: 'wpn_default', name: 'Katana Arrugginita', price: 0, rarity: 'BASE', icon: '🗡️', desc: 'La spada base del ronin.', element: 'none', dmgBonus: 0 }
    ];

    ELEMENTS.forEach((el, eIdx) => {
        BLADE_FORMS.forEach((form, fIdx) => {
            const indexNum = eIdx * 6 + fIdx + 1;
            const price = Math.floor((10 + eIdx * 2) * form.priceMult);
            const dmgBonus = Math.floor((12 + eIdx * 4) * form.dmgMult);
            GENERATED_WEAPONS.push({
                id: `wpn_${el.key}_${fIdx}`,
                name: `#${indexNum} ${el.name} ${form.suffix}`,
                price: price,
                rarity: form.rarity,
                icon: el.icon,
                desc: `+${dmgBonus} Danno | ${el.perkDesc}`,
                element: el.key,
                bladeColor: el.blade,
                glowColor: el.glow,
                length: form.len,
                width: form.w,
                serrated: form.serrated,
                dmgBonus: dmgBonus
            });
        });
    });

    // ========================================================================
    // 2. CATALOGO MEGA SHOP + MICROTRANSAZIONI MONETE
    // ========================================================================
    const SHOP_ITEMS = {
        coins: [
            { id: 'coin_ad',     name: 'Spot Ricompensa',    rewardCoins: 750,    realPrice: 'GRATIS 🎬', rarity: 'AD REWARD', icon: '📺', desc: 'Guarda un breve video per +750 🪙 immediate!', isAd: true, color: '#a855f7' },
            { id: 'coin_daily',  name: 'Tributo Giornaliero',rewardCoins: 1500,   realPrice: 'BONUS 🎁',  rarity: 'DAILY',     icon: '🎁', desc: 'Riscatta +1.500 🪙 gratis una volta al giorno!', isDaily: true, color: '#38bdf8' },
            { id: 'coin_pack1',  name: 'Sacchetto Ronin',    rewardCoins: 3500,   realPrice: '€ 0.99',    rarity: 'STARTER',   icon: '🪙', desc: 'Accredita subito +3.500 🪙 nel portafoglio.', color: '#4ade80' },
            { id: 'coin_pack2',  name: 'Cassa dello Shogun', rewardCoins: 12000,  realPrice: '€ 2.49',    rarity: '+20% BONUS',icon: '🧰', desc: 'Accredita subito +12.000 🪙 nel portafoglio.', color: '#38bdf8' },
            { id: 'coin_pack3',  name: 'Forziere Imperiale', rewardCoins: 32000,  realPrice: '€ 4.99',    rarity: 'PIÙ VENDUTO',icon:'🏯', desc: 'Accredita subito +32.000 🪙 nel portafoglio!', color: '#facc15' },
            { id: 'coin_pack4',  name: 'Tesoro del Dio Oni', rewardCoins: 100000, realPrice: '€ 9.99',    rarity: 'MEGA PACK', icon: '👹', desc: 'Accredita +100.000 🪙 per sbloccare tutto!', color: '#ff0055' }
        ],
        weapons: GENERATED_WEAPONS,
        pets: [
            { id: 'pet_none',    name: 'Nessun Pet',         price: 0,     rarity: 'BASE',     icon: '✖️', desc: 'Viaggia in solitaria.', color: '#64748b' },
            { id: 'pet_wisp',    name: 'Fuoco Fatuo',        price: 800,   rarity: 'COMMON',   icon: '🔵', desc: 'Spara dardi spirituali (35 Dmg / 3.5s)', color: '#38bdf8', dmg: 35, fireRate: 210 },
            { id: 'pet_bat',     name: 'Pipistrello Vampiro',price: 1800,  rarity: 'RARE',     icon: '🦇', desc: 'Spara dardi cremisi (60 Dmg / 3.2s)',    color: '#e11d48', dmg: 60, fireRate: 190 },
            { id: 'pet_skull',   name: 'Teschio Maledetto',  price: 3500,  rarity: 'EPIC',     icon: '💀', desc: 'Spara fiamme d\'ossa (95 Dmg / 2.8s)',   color: '#a855f7', dmg: 95, fireRate: 170 },
            { id: 'pet_fox',     name: 'Volpe Kitsune',      price: 6500,  rarity: 'LEGEND',   icon: '🦊', desc: 'Spirito sacro rapido (140 Dmg / 2.4s)',  color: '#f97316', dmg: 140, fireRate: 145 },
            { id: 'pet_drone',   name: 'Cyber Drone X9',     price: 11000, rarity: 'MYTHIC',   icon: '🛸', desc: 'Laser al plasma (210 Dmg / 2.0s)',       color: '#00e5ff', dmg: 210, fireRate: 120 },
            { id: 'pet_phoenix', name: 'Fenice di Ghiaccio', price: 18000, rarity: 'MYTHIC',   icon: '🦅', desc: 'Tempesta glaciale (300 Dmg / 1.8s)',     color: '#7dd3fc', dmg: 300, fireRate: 108 },
            { id: 'pet_eye',     name: 'Occhio dell\'Abisso',price: 26000, rarity: 'DARK',     icon: '👁️', desc: 'Raggio del vuoto (420 Dmg / 1.5s)',      color: '#9333ea', dmg: 420, fireRate: 90 },
            { id: 'pet_dragon',  name: 'Cucciolo di Drago',  price: 38000, rarity: 'GODLY',    icon: '🐉', desc: 'Soffio draconico (600 Dmg / 1.2s)',      color: '#ffd700', dmg: 600, fireRate: 72 },
            { id: 'pet_oni',     name: 'Dio Oni Custode',    price: 50000, rarity: 'IMMORTAL', icon: '👹', desc: 'Distruzione totale (950 Dmg / 0.9s)',    color: '#ff0055', dmg: 950, fireRate: 55 }
        ],
        skins: [
            { id: 'skin_default', name: 'Ronin Base',         price: 0,     rarity: 'BASE',     icon: '🥋', desc: 'Lo stile classico del guerriero.', filter: 'none' },
            { id: 'skin_jade',    name: 'Jade Viper Ronin',   price: 500,   rarity: 'COMMON',   icon: '🐍', desc: 'Tunica verde giada.',              filter: 'hue-rotate(95deg) saturate(1.8)' },
            { id: 'skin_frost',   name: 'Frostbite Shogun',   price: 1200,  rarity: 'RARE',     icon: '🧊', desc: 'Guerriero dei ghiacci eterni.',    filter: 'hue-rotate(190deg) saturate(2.2) brightness(1.15)' },
            { id: 'skin_golden',  name: 'Golden Emperor',     price: 2800,  rarity: 'EPIC',     icon: '👑', desc: 'Armatura dorata imperiale.',       filter: 'sepia(1) saturate(3.5) hue-rotate(5deg) brightness(1.15)' },
            { id: 'skin_cyber',   name: 'Cyber Shinobi 2099', price: 5000,  rarity: 'LEGEND',   icon: '🤖', desc: 'Tinta al neon ciano cibernetica.', filter: 'hue-rotate(175deg) saturate(3.2) contrast(1.25)' },
            { id: 'skin_blood',   name: 'Blood Moon Samurai', price: 8500,  rarity: 'LEGEND',   icon: '🩸', desc: 'Bagnato dalla Luna di Sangue.',    filter: 'sepia(1) hue-rotate(310deg) saturate(4.5)' },

        if (btnEl) btnEl.classList.add('active');
        renderGrid();
    }

    function playCoinSound() {
        try {
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(587.33, actx.currentTime); // D5
            osc.frequency.setValueAtTime(880, actx.currentTime + 0.08); // A5
            gain.gain.setValueAtTime(0.25, actx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(actx.destination);
            osc.start();
            osc.stop(actx.currentTime + 0.35);
        } catch (e) {}
    }

    function creditCoins(amount) {
        walletCoins += amount;
        playCoinSound();
        saveShopData();
        const w = document.getElementById('wallet-display');
        w.style.transform = 'scale(1.18)';
        w.style.background = 'rgba(34, 197, 94, 0.45)';
        setTimeout(() => {
            w.style.transform = 'scale(1)';
            w.style.background = 'rgba(255, 215, 0, 0.15)';
        }, 450);
    }

    function updateUI() {
        document.getElementById('wallet-display').innerText = `🪙 ${walletCoins}`;
        const wpnObj   = SHOP_ITEMS.weapons.find(w => w.id === equipped.weapon) || SHOP_ITEMS.weapons[0];
        const petObj   = SHOP_ITEMS.pets.find(p => p.id === equipped.pet)       || SHOP_ITEMS.pets[0];
        const skinObj  = SHOP_ITEMS.skins.find(s => s.id === equipped.skin)     || SHOP_ITEMS.skins[0];
        const auraObj  = SHOP_ITEMS.auras.find(a => a.id === equipped.aura)     || SHOP_ITEMS.auras[0];
        const killObj  = SHOP_ITEMS.kills.find(k => k.id === equipped.kill)     || SHOP_ITEMS.kills[0];
        const trailObj = SHOP_ITEMS.trails.find(t => t.id === equipped.trail)   || SHOP_ITEMS.trails[0];

        let totalBonusHp = 0, totalBonusDmg = 0;
        SHOP_ITEMS.upgrades.forEach(u => {
            if (ownedItems.includes(u.id)) {
                if (u.hp) totalBonusHp += u.hp;
                if (u.dmg) totalBonusDmg += u.dmg;
            }
        });

        localStorage.setItem('oni_active_loadout', JSON.stringify({
            weapon: wpnObj,
            pet: petObj,
            killEffect: killObj,
            skinFilter: skinObj.filter,
            auraId: auraObj.id,
            auraType: auraObj.auraType,
            auraColor: auraObj.color,
            trailColor: trailObj.trailColor,
            vipCoins: ownedItems.includes('up_vip') || ownedItems.includes('up_triple_vip'),
            bonusHp: totalBonusHp,
            bonusDmg: totalBonusDmg,
            freeStartPerk: ownedItems.includes('up_perk') || ownedItems.includes('up_godmode')
        }));

        document.getElementById('equipped-summary').innerHTML =
            `ARMA: <b style="color:${wpnObj.glowColor || '#fff'}">${wpnObj.name}</b><br>` +
            `PET: <b style="color:${petObj.color || '#fff'}">${petObj.name}</b> | SKIN: <b style="color:#ffd700">${skinObj.name}</b><br>` +
            `BONUS: <b style="color:#4ade80">+${totalBonusHp} HP / +${totalBonusDmg} DMG</b>`;

        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';
        const list = SHOP_ITEMS[currentTab] || [];

        // Special rendering for Microtransactions / Coin Packs tab
        if (currentTab === 'coins') {
            const lastDaily = parseInt(localStorage.getItem('oni_daily_claim') || '0');
            const canClaimDaily = (Date.now() - lastDaily) > 86400000;

            list.forEach(pack => {
                const card = document.createElement('div');
                card.className = 'shop-card coin-card';
                let btnHtml = '';

                if (pack.isAd) {
                    btnHtml = `<button class="card-btn btn-ad" onclick="watchRewardedAd('${pack.id}')">${pack.realPrice}</button>`;
                } else if (pack.isDaily) {
                    if (canClaimDaily) {
                        btnHtml = `<button class="card-btn btn-buy" onclick="claimDailyCoins()">RISCATTA ORA 🎁</button>`;
                    } else {
                        btnHtml = `<button class="card-btn btn-equipped" disabled>GIÀ RISCATTATO ✅</button>`;
                    }
                } else {
                    btnHtml = `<button class="card-btn btn-real-money" onclick="openIapModal('${pack.id}')">🛒 ${pack.realPrice}</button>`;
                }

                card.innerHTML = `
                    <div class="card-rarity" style="background:${pack.color}; color:#000; font-weight:bold;">${pack.rarity}</div>
                    <div class="card-icon">${pack.icon}</div>
                    <div class="card-title" style="color:${pack.color}">${pack.name}</div>
                    <div class="card-desc">+${pack.rewardCoins.toLocaleString()} 🪙<br>${pack.desc}</div>
                    ${btnHtml}
                `;
                grid.appendChild(card);
            });
            return;
        }

        list.forEach(item => {
            const isOwned = ownedItems.includes(item.id);
            const isEquipped = (
                (currentTab === 'weapons'  && equipped.weapon === item.id) ||
                (currentTab === 'pets'     && equipped.pet === item.id)    ||
                (currentTab === 'skins'    && equipped.skin === item.id)   ||
                (currentTab === 'auras'    && equipped.aura === item.id)   ||
                (currentTab === 'kills'    && equipped.kill === item.id)   ||
                (currentTab === 'trails'   && equipped.trail === item.id)  ||
                (currentTab === 'upgrades' && isOwned)
            );

            const card = document.createElement('div');
            card.className = 'shop-card' + (isEquipped ? ' equipped' : '');

            let btnHtml = '';
            if (!isOwned) {
                btnHtml = `<button class="card-btn btn-buy" onclick="buyItem('${item.id}', ${item.price})">🪙 COMPRA (${item.price})</button>`;
            } else if (item.isUpgrade) {
                btnHtml = `<button class="card-btn btn-equipped" disabled>ATTIVO ✅</button>`;
            } else if (isEquipped) {
                btnHtml = `<button class="card-btn btn-equipped" disabled>EQUIPAGGIATO ✅</button>`;
            } else {
                btnHtml = `<button class="card-btn btn-equip" onclick="equipItem('${item.id}')">EQUIPAGGIA</button>`;
            }

            card.innerHTML = `
                <div class="card-rarity" style="background:${item.glowColor || item.color || '#ec4899'}; color:#000; font-weight:bold;">${item.rarity}</div>
                <div class="card-icon">${item.icon}</div>
                <div class="card-title" style="color:${item.glowColor || item.color || '#ffd700'}">${item.name}</div>
                <div class="card-desc">${item.desc}</div>
                ${btnHtml}
            `;
            grid.appendChild(card);
        });
    }

    async function watchRewardedAd(packId) {
        const pack = SHOP_ITEMS.coins.find(p => p.id === packId);
        if (!pack) return;

        // Usa l'SDK di CrazyGames SOLO se il gioco gira davvero dentro il dominio CrazyGames
        const isOnCrazyGames = window.location.hostname.includes('crazygames') &&
                               window.CrazyGames && window.CrazyGames.SDK;

        if (isOnCrazyGames) {
            try {
                await window.CrazyGames.SDK.init();
                window.CrazyGames.SDK.ad.requestAd('rewarded', {
                    adStarted: () => {},
                    adFinished: () => { creditCoins(pack.rewardCoins); },
                    adError: () => { simulateLocalAd(pack); }
                });
                return;
            } catch (err) {
                simulateLocalAd(pack);
                return;
            }
        }

        // In locale (127.0.0.1) o fuori da CrazyGames avvia sempre il Player Video integrato!
        simulateLocalAd(pack);
    }

    function simulateLocalAd(pack) {
        if (_adInterval) clearInterval(_adInterval);
        if (_adAnimReq) cancelAnimationFrame(_adAnimReq);

        pendingCoinPack = pack;
        document.getElementById('iap-icon').innerText = '🎬';
        document.getElementById('iap-title').innerText = 'SPOT VIDEO RICOMPENSA';
        document.getElementById('iap-payment-section').style.display = 'none';
        document.getElementById('iap-cancel-btn').style.display = 'none'; // Blocca chiusura durante i 5s di spot

        // Crea uno schermo video animato + barra di avanzamento dentro il modal
        document.getElementById('iap-desc').innerHTML = `
            <canvas id="ad-video-canvas" width="320" height="140" style="width:100%; border-radius:8px; border:2px solid #a855f7; background:#090a12; margin-bottom:8px;"></canvas>
            <div style="width:100%; height:10px; background:#1e293b; border-radius:5px; overflow:hidden; border:1px solid #475569;">
                <div id="ad-progress-bar" style="width:0%; height:100%; background:linear-gradient(90deg, #a855f7, #ec4899); transition:width 0.25s linear;"></div>
            </div>
            <div id="ad-timer-text" style="margin-top:8px; color:#e9d5ff; font-size:8px;">Guarda fino alla fine per +${pack.rewardCoins} 🪙 (5s)</div>
        `;

        const confirmBtn = document.getElementById('iap-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.style.opacity = '0.5';
        confirmBtn.innerText = 'SPOT IN RIPRODUZIONE (5s)...';
        document.getElementById('iap-modal').style.display = 'flex';

        // Animazione dentro lo schermo video dello spot
        const adCanvas = document.getElementById('ad-video-canvas');
        const adCtx = adCanvas.getContext('2d');
        let adFrame = 0;

        function renderAdVideo() {
            adFrame++;
            adCtx.fillStyle = '#0d0b18';
            adCtx.fillRect(0, 0, adCanvas.width, adCanvas.height);

            // Raggi rotanti stile banner arcade
            adCtx.save();
            adCtx.translate(160, 70);
            adCtx.rotate(adFrame * 0.03);
            adCtx.fillStyle = 'rgba(168, 85, 247, 0.18)';
            for (let i = 0; i < 8; i++) {
                adCtx.rotate(Math.PI / 4);
                adCtx.fillRect(0, -8, 200, 16);
            }
            adCtx.restore();

            // Personaggio animato nello spot
            if (attackImg.complete && attackImg.naturalWidth > 0) {
                const fw = attackImg.width / 6;
                const f = Math.floor(adFrame / 5) % 6;
                adCtx.drawImage(attackImg, f * fw, 0, fw, attackImg.height, 95, 5, fw * 1.1, attackImg.height * 1.1);
            }

            adCtx.fillStyle = '#ffd700';
            adCtx.font = "bold 11px 'Press Start 2P', monospace";
            adCtx.textAlign = 'center';
            adCtx.fillText('🔥 ONI BLOX GOD PACK 🔥', 160, 32);

            adCtx.fillStyle = '#4ade80';
            adCtx.font = "9px 'Press Start 2P', monospace";
            adCtx.fillText(`RICOMPENSA: +${pack.rewardCoins} MONETE!`, 160, 122);

            _adAnimReq = requestAnimationFrame(renderAdVideo);
        }
        renderAdVideo();

        // Conto alla rovescia di 5 secondi con barra che si riempie
        const totalSec = 5;
        let elapsed = 0;
        _adInterval = setInterval(() => {
            elapsed++;
            const pct = Math.min(100, (elapsed / totalSec) * 100);
            const bar = document.getElementById('ad-progress-bar');
            const txt = document.getElementById('ad-timer-text');
            if (bar) bar.style.width = pct + '%';

            const left = totalSec - elapsed;
            if (left > 0) {
                if (txt) txt.innerText = `Guarda fino alla fine per +${pack.rewardCoins} 🪙 (${left}s)`;
                confirmBtn.innerText = `SPOT IN RIPRODUZIONE (${left}s)...`;
            } else {
                clearInterval(_adInterval);
                _adInterval = null;
                if (txt) txt.innerHTML = `<b style="color:#4ade80">SPOT COMPLETATO! RICOMPENSA PRONTA!</b>`;
                confirmBtn.disabled = false;
                confirmBtn.style.opacity = '1';
                confirmBtn.innerText = `🎁 RISCATTA +${pack.rewardCoins} 🪙`;
                confirmBtn.onclick = () => {
                    creditCoins(pack.rewardCoins);
                    confirmBtn.onclick = confirmMicrotransaction; // Ripristina handler normale
                    closeIapModal();
                };
            }
        }, 1000);
    }

    function buyItem(id, price) {
        if (walletCoins < price) {
            // Se non hai abbastanza monete, lampeggia in rosso e ti apre il tab Ricarica Monete!
            const w = document.getElementById('wallet-display');
            w.style.background = 'rgba(239, 68, 68, 0.55)';
            setTimeout(() => {
                w.style.background = 'rgba(255, 215, 0, 0.15)';
                openCoinsTab();
            }, 450);
            return;
        }
        walletCoins -= price;
        if (!ownedItems.includes(id)) ownedItems.push(id);
        equipItem(id);
        saveShopData();
    }

    function equipItem(id) {
        if (currentTab === 'weapons') equipped.weapon = id;
        else if (currentTab === 'pets') equipped.pet = id;
        else if (currentTab === 'skins') equipped.skin = id;
        else if (currentTab === 'auras') equipped.aura = id;
        else if (currentTab === 'kills') equipped.kill = id;
        else if (currentTab === 'trails') equipped.trail = id;
        saveShopData();
    }

    // ========================================================================
    // 5. ANTEPRIMA LIVE (Katana dietro in Idle a 1.2*PI, Corpo, Pet e Aura)
    // ========================================================================
    const pCanvas = document.getElementById('preview-canvas');
    const ctx = pCanvas.getContext('2d');

    const idleImg = new Image();   idleImg.src = './img/MartialHero/Idle.png';
    const attackImg = new Image(); attackImg.src = './img/MartialHero/Attack1.png';
    const aura1Img = new Image();  aura1Img.src = './img/MartialHero/Aura.png';
    const aura2Img = new Image();  aura2Img.src = './img/Night/Aura.png';

    let pFrame = 0, pTick = 0, isPreviewAttacking = false, auraFrame = 0;

    function triggerPreviewAttack() {
        isPreviewAttacking = true;
        pFrame = 0;
    }

    function animatePreview() {
        ctx.clearRect(0, 0, pCanvas.width, pCanvas.height);

        const wpnObj  = SHOP_ITEMS.weapons.find(w => w.id === equipped.weapon) || SHOP_ITEMS.weapons[0];
        const petObj  = SHOP_ITEMS.pets.find(p => p.id === equipped.pet)       || SHOP_ITEMS.pets[0];
        const skinObj = SHOP_ITEMS.skins.find(s => s.id === equipped.skin)     || SHOP_ITEMS.skins[0];
        const auraObj = SHOP_ITEMS.auras.find(a => a.id === equipped.aura)     || SHOP_ITEMS.auras[0];

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(20, 175, 180, 6);

        const activeImg = isPreviewAttacking ? attackImg : idleImg;
        const maxF = isPreviewAttacking ? 6 : 8;

        pTick++;
        if (pTick % 6 === 0) {
            pFrame++;
            auraFrame = (auraFrame + 1) % 16;
            if (pFrame >= maxF) { pFrame = 0; isPreviewAttacking = false; }
        }

        const drawPreviewWeapon = () => {
            if (!wpnObj || wpnObj.id === 'wpn_default') return;
            let hx = 102, hy = 132, ang = 1.2 * Math.PI, slash = false;
            if (isPreviewAttacking) {
                if (pFrame <= 1)      { hx = 104; hy = 102; ang = 1.35 * Math.PI; }
                else if (pFrame === 2){ hx = 118; hy = 108; ang = -0.35 * Math.PI; }
                else                  { hx = 135; hy = 128; ang = 0.12 * Math.PI; slash = true; }
            }
            const len = (wpnObj.length || 90) * 0.65;
            const w = (wpnObj.width || 7) * 0.75;

            ctx.save();
            ctx.translate(hx, hy);
            ctx.rotate(ang);
            ctx.fillStyle = wpnObj.glowColor;
            ctx.globalAlpha = isPreviewAttacking ? 0.6 : 0.3;
            ctx.fillRect(0, -w, len + 5, w * 2);
            ctx.globalAlpha = 1;
            ctx.fillStyle = wpnObj.bladeColor;
            ctx.fillRect(0, -w / 2, len, w);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(-3, -w - 2, 4, w * 2 + 4);
            ctx.restore();

            if (slash) {
                ctx.save();
                ctx.strokeStyle = wpnObj.glowColor;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(115, 125, len + 18, -1.0, 0.8);
                ctx.stroke();
                ctx.restore();
            }
        };

        if (!isPreviewAttacking) drawPreviewWeapon();

        ctx.save();
        if (skinObj.filter && skinObj.filter !== 'none') ctx.filter = skinObj.filter;
        if (activeImg.complete && activeImg.naturalWidth > 0) {
            const fw = activeImg.width / maxF;
            ctx.drawImage(activeImg, pFrame * fw, 0, fw, activeImg.height, 110 - (fw * 1.8) / 2, 125 - (activeImg.height * 1.8) / 2, fw * 1.8, activeImg.height * 1.8);
        }
        ctx.restore();

        if (isPreviewAttacking) drawPreviewWeapon();

        if (auraObj.auraType === 'procedural_lightning' || auraObj.auraType === 'procedural_gold') {
            ctx.save();
            ctx.strokeStyle = auraObj.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(110, 125, 46 + Math.sin(Date.now() * 0.01) * 5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        } else if ((auraObj.auraType === 'sprite1' && aura1Img.complete && aura1Img.naturalWidth > 0) ||
                   (auraObj.auraType === 'sprite2' && aura2Img.complete && aura2Img.naturalWidth > 0)) {
            const aImg = auraObj.auraType === 'sprite1' ? aura1Img : aura2Img;
            const afw = aImg.width / 16;
            ctx.drawImage(aImg, auraFrame * afw, 0, afw, aImg.height, 35, 45, afw * 1.4, aImg.height * 1.4);
        }

        if (petObj && petObj.id !== 'pet_none') {
            const t = Date.now() * 0.005;
            const px = 68 + Math.cos(t * 1.5) * 6;
            const py = 92 + Math.sin(t * 2.2) * 8;
            ctx.save();
            ctx.fillStyle = petObj.color || '#00e5ff';
            ctx.beginPath();
            ctx.arc(px, py, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = "14px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(petObj.icon, px, py + 5);
            ctx.restore();
        }

        requestAnimationFrame(animatePreview);
    }

    updateUI();
    animatePreview();
    </script>
</body>
</html>
