<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="utf-8">
        <title>Oni Fighting</title>
        <link rel ="stylesheet" href ="./css/style.css">
        <link rel ="stylesheet" href ="./css/game.css">
        <!-- Blocca lo zoom con le dita -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            
        <!-- Abilita il vero Fullscreen su iOS se salvato nella Home -->
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="mobile-web-app-capable" content="yes">
    </head>
    <body>
        <div id ="Gioco">
            <div id ="Interface">
                <div id = "Giocatore">
                    <div class ="NomeGiocatore" id ="P1"></div>
                    <div id = "P1-container">
                        <div class="health-bar-container">
                            <div id ="P1HP" class="health-bar"></div>
                        </div>
                        <div id = "stamina-bar-container">
                            <div id ="stamina-bar"></div>
                        </div>
                    </div>
                </div>
                <div id ="Timer" class="text-gold">60</div>
                <button id="btn-fullscreen">⛶</button>
            </div>
            <div id ="Announcement" class="text-gold" ></div>
            <canvas width = "1280" height = "720" id ="Game"></canvas>
            <div id="mobile-controls">
    <div class="dpad">
        <button id="btn-left">◀</button>
        <button id="btn-right">▶</button>
    </div>  
    <div class="actions">
        <button id="btn-up">▲</button>
        <button id="btn-defend">💨</button>
        <button id="btn-attack">⚔️</button>
    </div>
</div>
<div id ="choosing-enemies">
            <button class = "spawn-enemies" onclick = "IncrementEnemies(2)">Launcher</button>
            <button class = "spawn-enemies" onclick = "IncrementEnemies(3)">BigAhhLauncher</button>
            <button class = "spawn-enemies" onclick = "IncrementEnemies(4)">Base</button>
            <button class = "spawn-enemies" onclick = "DropPotions()">Potion</button>
        </div>
        </div>
        
        
        <script src="./js/utils.js"></script>
        <script src="./js/global.js"></script>
        <script src="./js/constants.js"></script>
        <script src="./js/classes.js"></script>
        <script src="./js/getAPI.js"></script>
        <script src="./js/game.js"></script>
        
    </body>
</html>
